<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Crack, colour, twist, resize, and rebuild. A little game about figuring things out." />
    <title>Hunter's Game</title>
  </head>
  <body>
    <main id="app" aria-label="Hunter's Game">
      <div id="game" aria-label="Interactive puzzle canvas"></div>
      <div id="interface" hidden>
        <header>
          <span class="brand">H<span class="brand-dot">.</span>G</span>
          <div id="chapter" aria-live="polite"></div>
          <nav aria-label="Game controls">
            <button id="sound" aria-pressed="true" title="Toggle sound">Sound on</button>
            <button id="effects" aria-pressed="false" title="Reduce movement and disable the final flash">Reduce effects</button>
            <button id="restart" title="Restart from the black screen">Restart</button>
          </nav>
        </header>
        <footer>
          <div><p id="instruction" aria-live="polite"></p><p id="detail"></p></div>
          <div class="footer-end"><div id="progress" aria-label="Puzzle progress"></div><a href="/credits.html" target="_blank" rel="noopener">Credits ↗</a></div>
        </footer>
        <div id="letter-controls" class="sr-only" aria-label="Keyboard puzzle controls"></div>
        <p id="announcement" class="sr-only" role="status"></p>
      </div>
      <button id="replay" hidden>Play again <span aria-hidden="true">↗</span></button>
      <dialog id="restart-dialog">
        <h2>Back to the beginning?</h2>
        <p>This will reset all five puzzles.</p>
        <div><button id="cancel-restart">Keep playing</button><button id="confirm-restart">Start over</button></div>
      </dialog>
      <noscript>This game needs JavaScript enabled in your browser.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
